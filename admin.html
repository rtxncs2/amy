<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BandhanSetu Admin Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --crimson: #8B1A1A; --gold: #C8922A; --blush: #F5EDE3;
    --ivory: #FDFAF6; --charcoal: #1E1E1E; --slate: #4A4A5A;
    --muted: #8A8A9A; --border: #E2D9CE; --success: #2D7D52; --danger: #C0392B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--ivory); color: var(--charcoal); min-height: 100vh; }

  nav {
    background: var(--crimson); padding: 0 2rem; display: flex; align-items: center;
    justify-content: space-between; height: 64px; box-shadow: 0 2px 16px rgba(139,26,26,0.25);
  }
  .nav-brand { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--gold); letter-spacing: 0.5px; }
  .nav-brand span { color: #fff; font-weight: 400; }
  .nav-links { display: flex; gap: 0.25rem; }
  .nav-btn {
    background: none; border: none; color: rgba(255,255,255,0.82); font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem; font-weight: 500; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; text-decoration: none;
  }
  .nav-btn:hover, .nav-btn.active { background: rgba(255,255,255,0.15); color: #fff; }

  #admin-panel { max-width: 860px; margin: 2rem auto; padding: 0 1.5rem; display: block; }
  .admin-header { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--crimson); margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 2px solid var(--border); }
  .admin-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
  .admin-card h3 { font-family: 'Playfair Display', serif; font-size: 1.05rem; margin-bottom: 1.25rem; color: var(--charcoal); }
  
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-group { display: flex; flex-direction: column; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 0.78rem; font-weight: 600; color: var(--slate); text-transform: uppercase; margin-bottom: 0.35rem; }
  .form-group input, .form-group select, .form-group textarea {
    padding: 0.55rem 0.75rem; border: 1.5px solid var(--border); border-radius: 7px;
    font-family: 'DM Sans', sans-serif; font-size: 0.875rem; background: var(--ivory);
  }
  .form-group textarea { resize: vertical; min-height: 80px; }
  
  .submit-btn {
    background: var(--crimson); color: #fff; border: none; border-radius: 8px; padding: 0.65rem 1.75rem;
    font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 0.75rem; display: inline-block;
  }
  
  .admin-list-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  .admin-list-table th { text-align: left; padding: 0.6rem 0.75rem; background: var(--blush); color: var(--crimson); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
  .admin-list-table td { padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border); }
  .del-btn { background: none; border: 1px solid #e0a0a0; color: var(--danger); border-radius: 5px; padding: 2px 8px; font-size: 0.75rem; cursor: pointer; }
  .del-btn:hover { background: var(--danger); color: #fff; }

  .toast {
    position: fixed; bottom: 2rem; right: 2rem; background: var(--success); color: #fff;
    padding: 0.75rem 1.25rem; border-radius: 8px; font-size: 0.88rem; font-weight: 500;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 300; opacity: 0; transform: translateY(8px);
    transition: all 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">Bandhan<span>Setu</span></div>
  <div class="nav-links">
    <a href="index.html" class="nav-btn">View Profiles</a>
    <button class="nav-btn active">Admin Panel</button>
  </div>
</nav>

<div id="admin-panel">
  <h2 class="admin-header">⚙️ Admin Panel – Manage Profiles</h2>

  <div class="admin-card">
    <h3>➕ Enroll New Profile</h3>
    <div class="form-grid">
      <div class="form-group"><label>Full Name *</label><input id="a-name" placeholder="e.g. Priya Sharma"></div>
      <div class="form-group"><label>Gender *</label><select id="a-gender"><option>Male</option><option>Female</option><option>Other</option></select></div>
      <div class="form-group"><label>Date of Birth *</label><input type="date" id="a-dob"></div>
      <div class="form-group"><label>Marital Status</label><select id="a-marital"><option>Never Married</option><option>Divorced</option><option>Widowed</option><option>Awaiting Divorce</option></select></div>
      <div class="form-group"><label>Height (cm)</label><input type="number" id="a-height" placeholder="170"></div>
      <div class="form-group"><label>Physical Status</label><select id="a-physical"><option>Normal</option><option>Physically Challenged</option></select></div>
      <div class="form-group"><label>Email *</label><input type="email" id="a-email" placeholder="name@email.com"></div>
      <div class="form-group"><label>Phone</label><input id="a-phone" placeholder="+91 9XXXXXXXXX"></div>
      <div class="form-group"><label>Profile Created By</label><select id="a-created-by"><option>Self</option><option>Parent</option><option>Sibling</option><option>Friend</option></select></div>
      <div class="form-group"><label>Religion</label><select id="a-religion"><option>Hindu</option><option>Muslim</option><option>Christian</option><option>Sikh</option><option>Buddhist</option><option>Jain</option><option>Other</option></select></div>
      <div class="form-group"><label>Mother Tongue</label><input id="a-tongue" placeholder="e.g. Tamil"></div>
      <div class="form-group"><label>Caste / Sub-Caste</label><input id="a-caste" placeholder="e.g. Brahmin"></div>
      <div class="form-group"><label>Gothra</label><input id="a-gothra" placeholder="e.g. Kashyapa"></div>
      <div class="form-group"><label>Manglik Status</label><select id="a-manglik"><option>No</option><option>Yes</option><option>Don't Know</option></select></div>
      <div class="form-group"><label>Highest Education</label><select id="a-edu"><option>Bachelors</option><option>Masters</option><option>Doctorate</option><option>Diploma</option></select></div>
      <div class="form-group"><label>Education Detail</label><input id="a-edu-detail" placeholder="e.g. B.Tech, MBA"></div>
      <div class="form-group"><label>Employment Sector</label><select id="a-employ"><option>Private</option><option>Government</option><option>Business</option><option>Not Employed</option></select></div>
      <div class="form-group"><label>Occupation / Job Title</label><input id="a-occ" placeholder="e.g. Software Engineer"></div>
      <div class="form-group"><label>Annual Income</label><input id="a-income" placeholder="e.g. ₹8-12 LPA"></div>
      <div class="form-group"><label>Country</label><input id="a-country" placeholder="India"></div>
      <div class="form-group"><label>State</label><input id="a-state" placeholder="e.g. Kerala"></div>
      <div class="form-group"><label>City</label><input id="a-city" placeholder="e.g. Kochi"></div>
      <div class="form-group"><label>Citizenship</label><input id="a-citizen" placeholder="Indian"></div>
      <div class="form-group"><label>Residential Status</label><select id="a-res"><option>Citizen</option><option>Permanent Resident</option><option>NRI</option><option>Student Visa</option></select></div>
      <div class="form-group"><label>Diet</label><select id="a-diet"><option>Vegetarian</option><option>Non-Vegetarian</option><option>Vegan</option><option>Eggetarian</option></select></div>
      <div class="form-group"><label>Smoking</label><select id="a-smoke"><option>No</option><option>Yes</option><option>Occasionally</option></select></div>
      <div class="form-group"><label>Drinking</label><select id="a-drink"><option>No</option><option>Yes</option><option>Occasionally</option></select></div>
      <div class="form-group"><label>Family Values</label><select id="a-family"><option>Traditional</option><option>Orthodox</option><option>Moderate</option><option>Liberal</option></select></div>
      <div class="form-group full"><label>About Myself</label><textarea id="a-bio" placeholder="A short bio about the person..."></textarea></div>
    </div>
    <button class="submit-btn" onclick="enrollProfile()">Enroll Profile</button>
  </div>

  <div class="admin-card">
    <h3>📋 All Profiles (<span id="admin-count">0</span>)</h3>
    <div style="overflow-x:auto;">
      <table class="admin-list-table">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Religion</th><th>City</th><th>Occupation</th><th>Action</th></tr>
        </thead>
        <tbody id="admin-table-body"></tbody>
      </table>
    </div>
  </div>

  <div class="admin-card">
    <h3>💾 Data Sync</h3>
    <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center;">
      <input type="file" id="import-json-input" accept=".json,application/json" hidden onchange="importProfiles(event)">
      <button class="submit-btn" onclick="document.getElementById('import-json-input').click()" style="background:#6C5CE7;">⬆ Import profiles.json</button>
      <button class="submit-btn" onclick="exportProfiles()" style="background:var(--success);">⬇ Export Updated profiles.json</button>
      <button class="submit-btn" onclick="resetToJSON()" style="background:var(--danger);margin-top:0;">↺ Reload Fresh From JSON</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let profiles = [];

async function loadProfiles() {
  try {
    const response = await fetch('profiles.json', { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    validateProfiles(data);
    profiles = data;
    renderAdminTable();
  } catch (err) {
    console.error('Error fetching profiles.json:', err);
    profiles = [];
    renderAdminTable();
    showToast('Could not load profiles.json. Import a JSON database to begin.', true);
  }
}


function calcAge(dob) {
  const b = new Date(dob), now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return age;
}

function nextId() {
  const nums = profiles.map(p => parseInt(p.id.replace('BS',''))).filter(n => !isNaN(n));
  return 'BS' + String(Math.max(0, ...nums) + 1).padStart(3, '0');
}

function renderAdminTable() {
  document.getElementById('admin-count').textContent = profiles.length;
  document.getElementById('admin-table-body').innerHTML = profiles.map(p => `
    <tr>
      <td><strong>${p.id}</strong></td><td>${p.name}</td><td>${calcAge(p.dob)}</td>
      <td>${p.gender}</td><td>${p.religion}</td><td>${p.city}</td>
      <td>${p.occupation}</td><td><button class="del-btn" onclick="deleteProfile('${p.id}')">Delete</button></td>
    </tr>`).join('');
}

function deleteProfile(id) {
  if (!confirm(`Delete profile ${id}?`)) return;
  profiles = profiles.filter(p => p.id !== id);
  renderAdminTable();
  showToast('Profile deleted.');
}

function enrollProfile() {
  const name = document.getElementById('a-name').value.trim();
  const dob  = document.getElementById('a-dob').value;
  const email = document.getElementById('a-email').value.trim();
  if (!name || !dob || !email) { showToast('Fill Name, Date of Birth, and Email.', true); return; }

  const newP = {
    id: nextId(), name, gender: document.getElementById('a-gender').value, dob,
    maritalStatus: document.getElementById('a-marital').value,
    heightCm: parseInt(document.getElementById('a-height').value) || 165,
    physicalStatus: document.getElementById('a-physical').value, email,
    phone: document.getElementById('a-phone').value.trim() || 'N/A',
    profileCreatedBy: document.getElementById('a-created-by').value,
    religion: document.getElementById('a-religion').value,
    motherTongue: document.getElementById('a-tongue').value.trim() || 'Hindi',
    caste: document.getElementById('a-caste').value.trim() || 'N/A',
    gothra: document.getElementById('a-gothra').value.trim() || 'N/A',
    manglik: document.getElementById('a-manglik').value,
    education: document.getElementById('a-edu').value,
    educationDetail: document.getElementById('a-edu-detail').value.trim() || 'N/A',
    employment: document.getElementById('a-employ').value,
    occupation: document.getElementById('a-occ').value.trim() || 'N/A',
    annualIncome: document.getElementById('a-income').value.trim() || 'N/A',
    country: document.getElementById('a-country').value.trim() || 'India',
    state: document.getElementById('a-state').value.trim() || 'N/A',
    city: document.getElementById('a-city').value.trim() || 'N/A',
    citizenship: document.getElementById('a-citizen').value.trim() || 'Indian',
    residentialStatus: document.getElementById('a-res').value,
    diet: document.getElementById('a-diet').value, smoking: document.getElementById('a-smoke').value,
    drinking: document.getElementById('a-drink').value, familyValues: document.getElementById('a-family').value,
    bio: document.getElementById('a-bio').value.trim() || 'No bio provided.',
    emoji: document.getElementById('a-gender').value === 'Female' ? '👩' : '👨'
  };

  profiles.push(newP); renderAdminTable();
  showToast(`Profile ${newP.id} added! Export profiles.json when finished.`);
  ['a-name','a-dob','a-email','a-phone','a-tongue','a-caste','a-gothra','a-edu-detail','a-occ','a-income','a-country','a-state','a-city','a-citizen','a-bio','a-height'].forEach(id => document.getElementById(id).value = '');
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = isError ? 'var(--danger)' : 'var(--success)';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
}

function validateProfiles(data) {
  if (!Array.isArray(data)) throw new Error('JSON database must contain an array of profiles.');
  for (const p of data) {
    if (!p || typeof p !== 'object' || !p.id || !p.name || !p.dob) {
      throw new Error('Each profile must contain at least id, name, and dob.');
    }
  }
}

function importProfiles(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      validateProfiles(data);
      profiles = data;
      renderAdminTable();
      showToast(`Imported ${profiles.length} profiles from ${file.name}.`);
    } catch (err) {
      showToast(`Import failed: ${err.message}`, true);
    } finally { event.target.value = ''; }
  };
  reader.onerror = () => { showToast('Could not read the selected JSON file.', true); event.target.value = ''; };
  reader.readAsText(file);
}

function exportProfiles() {
  try {
    validateProfiles(profiles);
    const blob = new Blob([JSON.stringify(profiles, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'profiles.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
    showToast(`Exported ${profiles.length} profiles to profiles.json`);
  } catch (err) { showToast(`Export failed: ${err.message}`, true); }
}

async function resetToJSON() {
  if (!confirm('Discard all unsaved admin changes and reload profiles.json from the server?')) return;
  await loadProfiles();
  showToast('Reloaded profiles from profiles.json.');
}

document.addEventListener('DOMContentLoaded', loadProfiles);
</script>
</body>
</html>
